name: Continuous Integration

on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          extra_options: -DENABLE_OPENVR=ON
          build_type: Release

        - name: Visual Studio 2022
          os: windows-2022
          extra_options: -DENABLE_OPENVR=ON
          build_type: Debug

        - name: macOS
          os: macos-14
          extra_options: -DHAVE_VULKAN=ON -DHAVE_GLES2=OFF -DDYN_OPENAL=OFF -DOPENAL_INCLUDE_DIR=/opt/homebrew/opt/openal-soft/include/AL -DOPENAL_LIBRARY=/opt/homebrew/opt/openal-soft/lib/libopenal.dylib
          deps_cmdline: |
            brew install   \
              dylibbundler \
              fluid-synth  \
              openal-soft  \
              vulkan-volk  \
              molten-vk    \
              libvpx       \
              sdl2
          build_type: Release

        - name: macOS
          os: macos-14
          extra_options: -DHAVE_VULKAN=ON -DHAVE_GLES2=OFF -DDYN_OPENAL=OFF -DOPENAL_INCLUDE_DIR=/opt/homebrew/opt/openal-soft/include/AL -DOPENAL_LIBRARY=/opt/homebrew/opt/openal-soft/lib/libopenal.dylib
          deps_cmdline: |
            brew install   \
              dylibbundler \
              fluid-synth  \
              openal-soft  \
              vulkan-volk  \
              molten-vk    \
              libvpx       \
              sdl2
          build_type: RelWithDebInfo

        - name: Linux GCC
          os: ubuntu-latest
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libwebp-dev waylandpp-dev libbz2-dev libomp-dev libopenal-dev
          build_type: RelWithDebInfo

        - name: Linux GCC
          os: ubuntu-latest
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libwebp-dev waylandpp-dev libbz2-dev libomp-dev libopenal-dev
          build_type: Release

        - name: Linux GCC Legacy
          os: ubuntu-22.04
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libwebp-dev waylandpp-dev libbz2-dev libomp-dev libopenal-dev
          build_type: RelWithDebInfo

        - name: Linux GCC Legacy
          os: ubuntu-22.04
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libwebp-dev waylandpp-dev libbz2-dev libomp-dev libopenal-dev
          build_type: Release

        - name: Linux ARM64 GCC
          os: ubuntu-24.04-arm
          extra_options: -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: Release

    steps:
    - name: Checkout QuestZDoom
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true
        path: ''
    - run: git fetch --deepen=100

    - name: Setup Git describe
      id: ghd
      uses: proudust/gh-describe@v2

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      if: runner.os == 'Windows'
      with:
        vcpkgDirectory: '${{ github.workspace }}/build/vcpkg'
        vcpkgGitCommitId: 'b322364f06308bdd24823f9d8f03fe0cc86fd46f'

    - name: Setup environment
      if: runner.os == 'Windows'
      shell: bash
      run: echo CMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV

    - name: Prepare OpenVR SDK dependency
      shell: bash
      run: |
        mkdir -p build
        export OPENVR_SDK=openvr-2.5.1
        echo OPENVR_SDK="${OPENVR_SDK}" >> $GITHUB_ENV
        cd build
        curl -LO "https://github.com/emawind84/gzdoom/releases/download/ci_deps/${OPENVR_SDK}.tar.gz"
        tar -xf "${OPENVR_SDK}.tar.gz"
    
    - name: Install Dependencies
      shell: bash
      env:
        ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        mkdir -p build
        cd build
        git clone https://github.com/emawind84/ZMusic.git
        cd ZMusic
        git checkout master
        cd ..
        cmake -B zmusic_build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_INSTALL_PREFIX=`pwd`/zmusic_install ZMusic
        cmake --build zmusic_build --target install --parallel 3

    - name: Configure
      shell: bash
      env:
        ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} 
        -DCMAKE_PREFIX_PATH=`pwd`/build/zmusic_install -DPK3_QUIET_ZIPDIR=ON
        -DOPENVR_SDK_PATH=`pwd`/build/${OPENVR_SDK}
        ${{ matrix.config.extra_options }} .

    - name: Build
      shell: bash
      run: |
        export GIT_DESCRIBE="${{ steps.ghd.outputs.describe }}"
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }}

    - name: Create Package
      # if: runner.os == 'Windows'  # Remove to make packages of all targets
      shell: bash
      run: |
        function fetch() { { curl -L "$3" | tee "$1" | sha256sum ; } && { echo "$2 $1" | sha256sum -c - ; } ; }

        cd build
        mkdir package
        packagename="${{ runner.os }}"-UZDoom-"${{ steps.ghd.outputs.describe }}"

        7z a package/licenses.zip ../docs/licenses/*

        if [[ "${{ runner.os }}" == 'Windows' ]]; then
          cp ${{ matrix.config.build_type }}/qzdoom.exe ${{ matrix.config.build_type }}/*.pk3 package
        elif [[ "${{ runner.os }}" == 'macOS' ]]; then
          cp -r qzdoom.app package
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          cp qzdoom *.pk3 package
        fi

    - name: Upload Package
      # if: runner.os == 'Windows'  # Remove to store packages of all targets
      uses: actions/upload-artifact@v4
      with:
        path: build/package
        name: ${{ matrix.config.name }} ${{ matrix.config.build_type }}

    - name: List Build Directory
      if: always()
      shell: bash
      run: |
        git status
        ls -lR build
